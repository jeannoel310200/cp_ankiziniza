<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { margin: 0; background: #f6f7fb; color: #202331; line-height: 1.65; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    article {
      background: #fff;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(31, 37, 56, .08);
    }
    h1 { margin-top: 0; line-height: 1.2; color: #152347; }
    h2 { margin-top: 32px; color: #263b6b; line-height: 1.3; font-size: 1.1rem; }
    li { margin: 6px 0; }
    .meta { color: #65708a; font-size: .95rem; }
    .notice {
      border-left: 4px solid #536dfe;
      background: #eef1ff;
      padding: 12px 16px;
      margin: 20px 0;
    }
    .error-banner {
      border-left: 4px solid #dc2626;
      background: #fef2f2;
      color: #991b1b;
      padding: 12px 16px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .success-banner {
      border-left: 4px solid #16a34a;
      background: #f0fdf4;
      color: #14532d;
      padding: 12px 16px;
      margin: 20px 0;
      border-radius: 4px;
    }
    form { margin: 24px 0; display: flex; flex-direction: column; gap: 16px; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
    input, textarea {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #d7dbe6;
      border-radius: 8px;
      color: #202331;
    }
    textarea { resize: vertical; }
    button {
      font: inherit;
      font-weight: 700;
      background: #536dfe;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      align-self: flex-start;
    }
    button:hover { background: #3f57e0; }
    code { background: #f0f2f7; padding: 2px 5px; border-radius: 4px; }
    a { color: #304dcc; }
    @media (max-width: 600px) { article { padding: 22px 18px; } }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>{{ title }}</h1>
      <p class="meta">{{ application_name }}</p>
      {{ body }}
      <h2>Contact</h2>
      <p>Pour toute question concernant votre compte ou vos données, contactez {{ contact }}.</p>
    </article>
  </main>
</body>
</html>
