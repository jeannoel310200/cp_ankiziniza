<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { margin: 0; background: #f6f7fb; color: #202331; line-height: 1.65; }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    article {
      background: #fff;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(31, 37, 56, .08);
    }
    h1 { margin-top: 0; line-height: 1.2; color: #152347; }
    h2 { margin-top: 32px; color: #263b6b; line-height: 1.3; }
    h3 { color: #344b7e; }
    li { margin: 8px 0; }
    .meta { color: #65708a; font-size: .95rem; }
    .notice {
      border-left: 4px solid #536dfe;
      background: #eef1ff;
      padding: 12px 16px;
      margin: 20px 0;
    }
    code { background: #f0f2f7; padding: 2px 5px; border-radius: 4px; }
    a { color: #304dcc; }
    @media (max-width: 600px) { article { padding: 22px 18px; } }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>{{ title }}</h1>
      <p class="meta">{{ application_name }} · Dernière mise à jour : {{ effective_date }}</p>
      <p class="notice">{{ intro }}</p>
      {{ body }}
      <h2>Contact</h2>
      <p>Pour toute question concernant ce document, votre compte ou vos données,
      contactez {{ contact }} ou utilisez le canal de support indiqué dans l'application.</p>
    </article>
  </main>
</body>
</html>
